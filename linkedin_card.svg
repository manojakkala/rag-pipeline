<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent)"/>

  <!-- Header -->
  <text x="60" y="110" fill="#e6e8ee" font-size="52" font-weight="800">Production-grade RAG</text>
  <text x="60" y="158" fill="#9aa3b2" font-size="25">3 problems you only hit when it's real — and how I fixed them</text>

  <!-- Card 1 -->
  <rect x="60" y="205" width="960" height="190" rx="18" fill="#1b2030" stroke="#2a2f3c" stroke-width="1.5"/>
  <circle cx="120" cy="265" r="30" fill="#1d3357"/>
  <text x="120" y="276" text-anchor="middle" fill="#9ec5ff" font-size="30" font-weight="800">1</text>
  <text x="175" y="262" fill="#e6e8ee" font-size="30" font-weight="700">A reranker made results WORSE</text>
  <text x="175" y="305" fill="#9aa3b2" font-size="22">It was faithfully ranking my messy text. Clean the data first —</text>
  <text x="175" y="335" fill="#9aa3b2" font-size="22">the same reranker then lifted my score</text>
  <text x="175" y="372" fill="#4caf50" font-size="24" font-weight="700">0.77 → 0.84</text>

  <!-- Card 2 -->
  <rect x="60" y="415" width="960" height="190" rx="18" fill="#1b2030" stroke="#2a2f3c" stroke-width="1.5"/>
  <circle cx="120" cy="475" r="30" fill="#1d3357"/>
  <text x="120" y="486" text-anchor="middle" fill="#9ec5ff" font-size="30" font-weight="800">2</text>
  <text x="175" y="472" fill="#e6e8ee" font-size="30" font-weight="700">A match score can't say "I don't know"</text>
  <text x="175" y="515" fill="#9aa3b2" font-size="22">Off-topic questions still got confident answers. A threshold can't</text>
  <text x="175" y="545" fill="#9aa3b2" font-size="22">tell "right" from "close but wrong" —</text>
  <text x="175" y="582" fill="#6ea8fe" font-size="24" font-weight="700">so a 2nd model fact-checks every answer</text>

  <!-- Card 3 -->
  <rect x="60" y="625" width="960" height="190" rx="18" fill="#1b2030" stroke="#2a2f3c" stroke-width="1.5"/>
  <circle cx="120" cy="685" r="30" fill="#1d3357"/>
  <text x="120" y="696" text-anchor="middle" fill="#9ec5ff" font-size="30" font-weight="800">3</text>
  <text x="175" y="682" fill="#e6e8ee" font-size="30" font-weight="700">The LLM was never the bottleneck</text>
  <text x="175" y="725" fill="#9aa3b2" font-size="22">Everyone blames the model. Tracing showed the slow step was</text>
  <text x="175" y="755" fill="#9aa3b2" font-size="22">reranking —</text>
  <text x="175" y="792" fill="#6ea8fe" font-size="24" font-weight="700">you can't fix what you don't measure</text>

  <!-- Metric strip -->
  <rect x="60" y="850" width="300" height="70" rx="14" fill="#12402f"/>
  <text x="210" y="885" text-anchor="middle" fill="#7ee0b0" font-size="22" font-weight="700">~90% recall</text>
  <text x="210" y="908" text-anchor="middle" fill="#7ee0b0" font-size="16">finds the right doc</text>

  <rect x="390" y="850" width="300" height="70" rx="14" fill="#1d3357"/>
  <text x="540" y="885" text-anchor="middle" fill="#9ec5ff" font-size="22" font-weight="700">MRR 0.813</text>
  <text x="540" y="908" text-anchor="middle" fill="#9ec5ff" font-size="16">ranking quality</text>

  <rect x="720" y="850" width="300" height="70" rx="14" fill="#3a2f12"/>
  <text x="870" y="885" text-anchor="middle" fill="#e0c07e" font-size="22" font-weight="700">Live demo</text>
  <text x="870" y="908" text-anchor="middle" fill="#e0c07e" font-size="16">deployed &amp; running</text>

  <!-- Stack footer -->
  <text x="60" y="990" fill="#9aa3b2" font-size="20">Python · Postgres + pgvector · hybrid search (vector + BM25) · cross-encoder · Groq · MCP · CI gate</text>
  <text x="60" y="1035" fill="#6b7280" font-size="18">github.com/manojakkala/rag-pipeline</text>
</svg>
